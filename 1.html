<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="simple.css" rel="stylesheet">
    <title>Herausforderung Künstliche Intelligenz</title>
  </head>
  <body>

   <header>
      <h1>Herausforderung Künstliche Intelligenz</h1>

      <nav aria-label="Hauptnavigation">
        <ul>
          <li><a href="index.html" aria-current="page">Wiederholung</a></li>
          <li><a href="kreativitaet.html">Kreativität entwickeln</a></li>
          <li><a href="kritische-nutzung.html">Kritsche KI-Nutzung</a></li>
        </ul>
      </nav>
    </header>
  <main>
    <h2>Ergebnis: Sokratischer Dialog</h2>
    <p>Unten findest du deinen individuell generierten Prompt. Kopiere ihn und nutze ihn in einem KI-Sprachmodell deiner Wahl:</p>
    <pre id="resultText"></pre>
    <button id="copyButton">Prompt kopieren</button>
  </main>
    
  
  <script>
    const urlParams = new URLSearchParams(window.location.search);
    const thema = urlParams.get('thema');
    
    const prompt = `Beginne einen sokratischen Dialog zum folgenden Thema: ${thema}.
Stelle mir eine erste kluge, vertiefende Frage.
Warte dann auf meine Antwort.
Erst danach stellst du die nächste Frage – offen, nachdenklich, anregend.
Gib keine Antworten, sondern unterstütze mich dabei, durch deine Fragen eigene Einsichten zu entwickeln.
Wiederhole diesen Prozess, bis ich den Dialog beende.`;
    
    document.getElementById('resultText').textContent = prompt;
    
    document.getElementById('copyButton').addEventListener('click', function() {
      navigator.clipboard.writeText(prompt).then(function() {
        alert('Prompt wurde in die Zwischenablage kopiert!');
      });
    });
  </script>
  </body>
</html>
